name: Revision quincenal de medidas
on:
  schedule:
    - cron: '23 12 1,15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no escribe nada)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node scripts/revision-medidas.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          ICU_MAP: ${{ secrets.ICU_MAP }}
          DRY_RUN: ${{ inputs.dry_run }}
