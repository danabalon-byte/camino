<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento en ruta</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1115">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://firestore.googleapis.com; base-uri 'none'; form-action 'none'">
<style>
:root{color-scheme:dark light;--bg:#0F1115;--card:#181B22;--line:#2A2F3A;--text:#F2F4F7;--muted:#9AA3B2;--accent:#6BD3A0;--warn:#F2B84B;--bad:#F26B6B}
@media (prefers-color-scheme:light){:root{--bg:#F5F6F8;--card:#FFFFFF;--line:#DDE1E8;--text:#14171C;--muted:#5B6575;--accent:#17875A;--warn:#B7791F;--bad:#C53030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
h1{font-size:26px;line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:14px}
.pill{align-self:flex-start;border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.warn{border-color:var(--warn)}.pill.bad{border-color:var(--bad)}
.big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--muted);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rail{position:relative;height:6px;border-radius:4px;background:var(--line);margin:12px 7px 8px}
.rail .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.rail i{position:absolute;top:-3px;width:2px;height:12px;background:var(--line)}
.rail i.on{background:var(--accent)}
.rail b{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.banner{border:2px solid var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.banner.bad{border-color:var(--bad)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ctl:first-of-type{border-top:0}
.ctl .n{font-weight:600}.ctl .t{text-align:right;font-variant-numeric:tabular-nums}.ctl .m{color:var(--muted);font-size:13px}
.ctl.done .n::before{content:"✓ ";color:var(--accent)}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;align-self:flex-start}
.note{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="card"><h1>Seguimiento en ruta</h1><p class="sub">Cargando…</p></div></main>
<script src="seguimiento.js" type="module"></script>
</body>
</html>
